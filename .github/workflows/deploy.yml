name: deploy

on:
  workflow_dispatch:
    inputs:
      lib_name:
        type: choice
        description: 'library names'
        required: true
        options:
          - simple_msteams
          - simple_sharepoint
          - simple_sftp
          - simple_sdcm
          - simple_ip_tools
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools
        pip install wheel
        pip install twine
    - name: Publish distribution
      shell: pwsh
      run: ./deploy.ps1 -RepoUrl "${{ secrets.REPO_URL }}" -User "${{ secrets.USER }}" -Pwd "${{ secrets.PWD }}" -Target "${{ github.event.inputs.lib_name }}"
